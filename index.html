<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My QQ</title>
    <style>
        :root { --qq-blue: #12B7F5; --bg-gray: #f5f5f5; --text-black: #333; --text-gray: #999; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-gray); color: var(--text-black); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* 顶部导航 */
        .header { background: var(--qq-blue); color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; position: relative; }
        
        /* 内容区域 */
        .content { flex: 1; overflow-y: auto; padding-bottom: 60px; }
        .page { display: none; height: 100%; }
        .page.active { display: flex; flex-direction: column; }
        
        /* 底部Tab */
        .tab-bar { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; height: 60px; }
        .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-gray); font-size: 12px; }
        .tab-item.active { color: var(--qq-blue); }
        .tab-icon { font-size: 22px; margin-bottom: 4px; }

        /* 列表样式 */
        .list-item { display: flex; align-items: center; padding: 15px; background: white; border-bottom: 1px solid #eee; }
        .avatar { width: 45px; height: 45px; border-radius: 5px; background: #ddd; margin-right: 15px; object-fit: cover; }
        .info { flex: 1; }
        .name { font-size: 16px; font-weight: bold; }
        .desc { font-size: 13px; color: var(--text-gray); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}

        /* 聊天界面 */
        #chatPage { background: #ededed; }
        .chat-header { background: var(--qq-blue); color: white; padding: 15px; display: flex; align-items: center; }
        .back-btn { margin-right: 15px; font-size: 20px; cursor: pointer; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .msg-row { display: flex; align-items: flex-start; gap: 10px; max-width: 85%; }
        .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
        .msg-bubble { background: white; padding: 10px; border-radius: 8px; font-size: 15px; line-height: 1.4; word-break: break-all; box-shadow: 0 1px 2px rgba(0,0,0,0.1);}
        .msg-row.me .msg-bubble { background: #95EC69; }
        .msg-bubble img { max-width: 200px; border-radius: 8px; margin-top: 5px;}
        
        .chat-input-area { background: #f7f7f7; padding: 10px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #ddd;}
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px;}
        .chat-input-area button { padding: 10px 15px; background: var(--qq-blue); color: white; border: none; border-radius: 5px; font-size: 15px;}
        .img-preview { max-height: 100px; margin-right: 10px; border-radius: 5px;}

        /* 设置与扩列 */
        .settings-group { background: white; margin: 15px; border-radius: 8px; overflow: hidden; }
        .settings-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;}
        .settings-item input { text-align: right; border: none; outline: none; color: var(--qq-blue); width: 60%;}
        .btn-primary { background: var(--qq-blue); color: white; padding: 12px; border: none; border-radius: 8px; font-size: 16px; width: calc(100% - 30px); margin: 15px; cursor: pointer;}

        /* 动态 */
        .moment-item { background: white; padding: 15px; margin-bottom: 10px; }
        .moment-content { margin-top: 10px; font-size: 15px; line-height: 1.5;}
        .moment-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin-top: 10px;}
    </style>
</head>
<body>

    <!-- 顶部标题 -->
    <div class="header" id="mainHeader">消息</div>

    <!-- 内容区 -->
    <div class="content">
        <!-- 1. 消息列表 -->
        <div id="msgPage" class="page active">
            <div id="msgList"></div>
        </div>

        <!-- 2. 联系人列表 -->
        <div id="contactPage" class="page">
            <div id="contactList"></div>
        </div>

        <!-- 3. 扩列 (添加好友) -->
        <div id="expandPage" class="page">
            <div style="padding: 20px; text-align: center;">
                <p style="color: #666; margin-bottom: 20px;">点击按钮，AI将为你随机生成一位性格、爱好各异的新朋友</p>
                <button class="btn-primary" onclick="expandFriend()" style="width: 100%; margin: 0;">🎲 随机扩列 (添加新朋友)</button>
            </div>
        </div>

        <!-- 4. 好友动态 -->
        <div id="momentPage" class="page">
            <div id="momentList" style="padding: 10px;"></div>
        </div>

        <!-- 5. 设置 -->
        <div id="settingsPage" class="page">
            <div class="settings-group">
                <div class="settings-item">API Base URL <input type="text" id="apiUrl" placeholder="如: https://api.openai.com/v1"></div>
                <div class="settings-item">API Key <input type="password" id="apiKey" placeholder="sk-xxx"></div>
                <div class="settings-item">模型名称 <input type="text" id="modelName" placeholder="如: gpt-4o / qwen-vl-max"></div>
            </div>
            <button class="btn-primary" onclick="saveSettings()">保存配置</button>
            <p style="text-align: center; color: #999; font-size: 12px; margin-top: 10px;">* 聊天图片互动需使用支持视觉的模型(如qwen-vl, gpt-4o)</p>
        </div>

        <!-- 聊天详情页 (隐藏) -->
        <div id="chatPage" class="page">
            <div class="chat-header">
                <span class="back-btn" onclick="exitChat()">＜</span>
                <span id="chatTitle">聊天</span>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="file" id="imgInput" accept="image/*" style="display:none" onchange="previewImage(event)">
                <span onclick="document.getElementById('imgInput').click()" style="font-size: 24px; cursor: pointer;">🖼️</span>
                <img id="imgPreview" class="img-preview" style="display:none;">
                <input type="text" id="chatInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
                <button onclick="sendMsg()">发送</button>
            </div>
        </div>
    </div>

    <!-- 底部Tab -->
    <div class="tab-bar" id="tabBar">
        <div class="tab-item active" onclick="switchTab('msg', '消息')"><div class="tab-icon">💬</div>消息</div>
        <div class="tab-item" onclick="switchTab('contact', '联系人')"><div class="tab-icon">👥</div>联系人</div>
        <div class="tab-item" onclick="switchTab('expand', '扩列')"><div class="tab-icon">🌟</div>扩列</div>
        <div class="tab-item" onclick="switchTab('moment', '动态')"><div class="tab-icon">📸</div>动态</div>
        <div class="tab-item" onclick="switchTab('settings', '设置')"><div class="tab-icon">⚙️</div>设置</div>
    </div>

    <script>
        // ================= 数据与状态管理 =================
        let config = JSON.parse(localStorage.getItem('qq_config')) || { url: '', key: '', model: '' };
        let friends = JSON.parse(localStorage.getItem('qq_friends')) || [];
        let moments = JSON.parse(localStorage.getItem('qq_moments')) || [];
        let currentChatFriendId = null;
        let currentImageBase64 = null;

        // 初始化设置
        document.getElementById('apiUrl').value = config.url;
        document.getElementById('apiKey').value = config.key;
        document.getElementById('modelName').value = config.model;

        // ================= UI 切换 =================
        function switchTab(tab, title) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(tab + 'Page').classList.add('active');
            event.currentTarget.classList.add('active');
            document.getElementById('mainHeader').innerText = title;
            document.getElementById('tabBar').style.display = 'flex';
            if(tab === 'msg') renderMsgList();
            if(tab === 'contact') renderContactList();
            if(tab === 'moment') renderMoments();
        }

        // ================= 设置模块 =================
        function saveSettings() {
            config.url = document.getElementById('apiUrl').value;
            config.key = document.getElementById('apiKey').value;
            config.model = document.getElementById('modelName').value;
            localStorage.setItem('qq_config', JSON.stringify(config));
            alert('保存成功！');
        }

        // ================= 扩列模块 (AI生成角色) =================
        async function expandFriend() {
            if(!config.key) return alert('请先在设置中配置API！');
            
            // 随机头像 (使用随机API或默认占位)
            const avatarUrl = `https://api.dicebear.com/7.0/adventurer-neutral/svg?seed=${Math.random()}`;
            
            const prompt = `你是一个角色生成器。请生成一个随机的中国年轻人物设定，严格输出JSON格式，不要包含markdown标记。
            字段包括：name(中文姓名), age(16-28岁), gender(男/女), personality(3个性格特点), hobbies(从cosplay, 二次元, 原神, 舞蹈生, 艺术生, 游戏玩家, 手游, 端游, 摄影, 宠物中随机选2个), catchphrase(一句符合人设的口头禅)。`;
            
            try {
                const res = await callAI([{role: 'user', content: prompt}], null, true);
                // 清理可能存在的markdown代码块标记
                const cleanJson = res.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                const persona = JSON.parse(cleanJson);
                
                const newFriend = {
                    id: Date.now().toString(),
                    name: persona.name,
                    avatar: avatarUrl,
                    age: persona.age,
                    gender: persona.gender,
                    persona: persona,
                    messages: []
                };
                friends.push(newFriend);
                localStorage.setItem('qq_friends', JSON.stringify(friends));
                
                // 生成一条初始动态
                generateMoment(newFriend);
                
                alert(`成功添加好友：${persona.name} (${persona.gender}, ${persona.age}岁)\n爱好：${persona.hobbies.join('/')}`);
                renderContactList();
            } catch (e) {
                alert('生成失败，请检查API配置或网络。错误：' + e.message);
            }
        }

        // ================= 动态模块 =================
        async function generateMoment(friend) {
            const prompt = `你现在扮演${friend.name}，${friend.age}岁${friend.gender}，性格${friend.persona.personality.join('、')}，爱好${friend.persona.hobbies.join('、')}。
            请发一条符合你人设的QQ空间动态（朋友圈）。要求：口语化，像真人发的，可以带点情绪或吐槽，字数在20-50字之间。只输出动态内容，不要加引号。`;
            
            try {
                const content = await callAI([{role: 'user', content: prompt}], null, true);
                moments.unshift({
                    id: Date.now().toString(),
                    friendId: friend.id,
                    friendName: friend.name,
                    avatar: friend.avatar,
                    content: content,
                    time: new Date().toLocaleString()
                });
                localStorage.setItem('qq_moments', JSON.stringify(moments));
            } catch(e) { console.error(e); }
        }

        function renderMoments() {
            const list = document.getElementById('momentList');
            list.innerHTML = moments.map(m => `
                <div class="moment-item">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${m.avatar}" class="avatar" style="width:35px;height:35px;">
                        <div>
                            <div style="font-weight:bold; color: var(--qq-blue);">${m.friendName}</div>
                            <div style="font-size:12px; color:#999;">${m.time}</div>
                        </div>
                    </div>
                    <div class="moment-content">${m.content}</div>
                </div>
            `).join('');
        }

        // ================= 聊天模块 =================
        function openChat(friendId) {
            currentChatFriendId = friendId;
            const friend = friends.find(f => f.id === friendId);
            document.getElementById('chatTitle').innerText = friend.name;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('chatPage').classList.add('active');
            document.getElementById('mainHeader').style.display = 'none';
            document.getElementById('tabBar').style.display = 'none';
            renderChatMessages();
        }

        function exitChat() {
            document.getElementById('chatPage').classList.remove('active');
            document.getElementById('msgPage').classList.add('active');
            document.getElementById('mainHeader').style.display = 'block';
            document.getElementById('tabBar').style.display = 'flex';
            document.getElementById('mainHeader').innerText = '消息';
            renderMsgList();
        }

        function renderChatMessages() {
            const friend = friends.find(f => f.id === currentChatFriendId);
            const container = document.getElementById('chatMessages');
            container.innerHTML = friend.messages.map(msg => `
                <div class="msg-row ${msg.role === 'user' ? 'me' : ''}">
                    <img src="${msg.role === 'user' ? 'https://api.dicebear.com/7.0/adventurer-neutral/svg?seed=me' : friend.avatar}" class="avatar" style="width:35px;height:35px;">
                    <div class="msg-bubble">
                        ${msg.content}
                        ${msg.image ? `<img src="${msg.image}">` : ''}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageBase64 = e.target.result;
                document.getElementById('imgPreview').src = currentImageBase64;
                document.getElementById('imgPreview').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        async function sendMsg() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text && !currentImageBase64) return;
            
            const friend = friends.find(f => f.id === currentChatFriendId);
            
            // 构建用户消息
            const userMsg = { role: 'user', content: text, image: currentImageBase64 };
            friend.messages.push(userMsg);
            
            input.value = '';
            document.getElementById('imgPreview').style.display = 'none';
            renderChatMessages();

            // 构建AI System Prompt
            const sysPrompt = `你现在必须完全扮演${friend.name}，${friend.age}岁${friend.gender}。
你的性格是：${friend.persona.personality.join('、')}。
你的爱好是：${friend.persona.hobbies.join('、')}。
你的口头禅是：“${friend.persona.catchphrase}”。
【严格要求】：
1. 完全沉浸角色，绝对不要暴露你是AI。
2. 使用符合该年龄和性格的日常口语，可以使用网络流行语、颜文字(如qwq, hh, 捏)。
3. 回复要简短、自然，像真人微信/QQ聊天，不要长篇大论，不要说教。
4. 如果用户发了图片，请根据图片内容结合你的人设做出真实的反应（如夸奖、吐槽、好奇等）。`;

            // 调用AI
            try {
                // 显示加载状态
                const loadingMsg = { role: 'assistant', content: '对方正在输入...' };
                friend.messages.push(loadingMsg);
                renderChatMessages();

                const aiReply = await callAI(friend.messages, sysPrompt, false, currentImageBase64);
                
                // 移除加载状态，添加真实回复
                friend.messages.pop(); 
                friend.messages.push({ role: 'assistant', content: aiReply });
                localStorage.setItem('qq_friends', JSON.stringify(friends));
                renderChatMessages();
            } catch (e) {
                friend.messages.pop();
                friend.messages.push({ role: 'assistant', content: '[网络或API错误，请检查设置]' });
                renderChatMessages();
            }
            currentImageBase64 = null;
        }

        // ================= 核心 AI API 调用 =================
        async function callAI(historyMessages, systemPrompt, isJsonMode = false, imageBase64 = null) {
            let messages = [];
            if (systemPrompt) messages.push({ role: 'system', content: systemPrompt });
            
            // 处理历史消息 (为了节省token，只取最近10条)
            const recentHistory = historyMessages.slice(-10); 
            for (let msg of recentHistory) {
                if (msg.role === 'user' || msg.role === 'assistant') {
                    if (msg.role === 'user' && msg === recentHistory[recentHistory.length - 1] && imageBase64) {
                        // 最后一条用户消息带图片 (多模态)
                        messages.push({
                            role: 'user',
                            content: [
                                { type: "text", text: msg.content || "请描述这张图片" },
                                { type: "image_url", image_url: { url: imageBase64 } }
                            ]
                        });
                    } else {
                        messages.push({ role: msg.role, content: msg.content });
                    }
                }
            }

            const response = await fetch(config.url + '/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + config.key
                },
                body: JSON.stringify({
                    model: config.model,
                    messages: messages,
                    temperature: 0.8,
                    response_format: isJsonMode ? { type: "json_object" } : undefined
                })
            });

            if (!response.ok) throw new Error('API请求失败: ' + response.statusText);
            const data = await response.json();
            return data.choices[0].message.content;
        }

        // ================= 列表渲染 =================
        function renderMsgList() {
            const list = document.getElementById('msgList');
            const activeFriends = friends.filter(f => f.messages.length > 0).reverse();
            if(activeFriends.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:50px; color:#999;">暂无消息，去扩列添加好友吧</div>';
                return;
            }
            list.innerHTML = activeFriends.map(f => {
                const lastMsg = f.messages[f.messages.length - 1];
                return `
                <div class="list-item" onclick="openChat('${f.id}')">
                    <img src="${f.avatar}" class="avatar">
                    <div class="info">
                        <div class="name">${f.name}</div>
                        <div class="desc">${lastMsg.content || '[图片]'}...</div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderContactList() {
            const list = document.getElementById('contactList');
            if(friends.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:50px; color:#999;">暂无好友</div>';
                return;
            }
            list.innerHTML = friends.map(f => `
                <div class="list-item" onclick="openChat('${f.id}')">
                    <img src="${f.avatar}" class="avatar">
                    <div class="info">
                        <div class="name">${f.name} <span style="font-size:12px; color:#999;">(${f.gender} ${f.age}岁)</span></div>
                        <div class="desc">${f.persona.hobbies.join(' / ')}</div>
                    </div>
                </div>
            `).join('');
        }

        // 初始化渲染
        renderMsgList();
    </script>
</body>
</html>
